<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECODE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #050505;
            --fg: #00ff88;
            --dim: #0d3d24;
            --muted: #1a5a3a;
            --accent: #ff2d2d;
            --card: #080c0a;
            --border: #143322;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--fg);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #rain {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .scanlines {
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px
            );
            z-index: 99;
        }

        .vignette {
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
            z-index: 98;
        }

        /* ---- INTRO ---- */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            transition: opacity 0.8s ease;
        }
        #intro.fade-out { opacity: 0; pointer-events: none; }

        .intro-line { min-height: 1.5em; }

        .stamp {
            display: inline-block;
            color: var(--accent);
            font-size: 0.6rem;
            letter-spacing: 0.5em;
            border: 1px solid var(--accent);
            padding: 4px 18px;
            opacity: 0;
            transform: rotate(-3deg) scale(0.9);
            transition: all 0.6s cubic-bezier(0.16,1,0.3,1);
        }
        .stamp.show { opacity: 1; transform: rotate(0) scale(1); }

        .btn-initiate {
            background: transparent;
            border: 1px solid var(--fg);
            color: var(--fg);
            font-family: inherit;
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            padding: 14px 48px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }
        .btn-initiate.show { opacity: 1; transform: translateY(0); }
        .btn-initiate:hover {
            background: var(--fg);
            color: var(--bg);
            box-shadow: 0 0 40px rgba(0,255,136,0.25), inset 0 0 40px rgba(0,255,136,0.05);
        }
        .btn-initiate:active { transform: scale(0.97); }
        .btn-initiate:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }

        /* ---- GAME ---- */
        #game {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            gap: 1.25rem;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #game.show { opacity: 1; }

        .label {
            font-size: 0.6rem;
            letter-spacing: 0.35em;
            color: var(--dim);
            text-transform: uppercase;
        }

        .cipher-box {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 1.5rem 1.5rem 1.5rem 2.5rem;
            width: 100%;
            max-width: 680px;
            position: relative;
            overflow: hidden;
        }
        .cipher-box::before {
            content: '>';
            position: absolute;
            top: 1.5rem; left: 1rem;
            color: var(--fg);
            opacity: 0.2;
            font-size: 0.9rem;
        }
        .cipher-box::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,136,0.03), transparent);
            animation: scanLine 4s linear infinite;
        }
        @keyframes scanLine {
            0% { left: -50%; }
            100% { left: 150%; }
        }

        .cipher-text {
            font-size: clamp(0.85rem,2.5vw,1.1rem);
            letter-spacing: 0.18em;
            line-height: 2.2;
            word-break: break-all;
            color: var(--fg);
            text-shadow: 0 0 8px rgba(0,255,136,0.15);
        }

        .shift-row {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .btn-shift {
            width: 42px; height: 42px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--fg);
            font-family: inherit;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            user-select: none;
        }
        .btn-shift:hover { background: var(--border); }
        .btn-shift:active { transform: scale(0.92); }
        .btn-shift:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

        .shift-num {
            font-size: 2.2rem;
            font-weight: 800;
            min-width: 50px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .decode-box {
            background: rgba(0,255,136,0.02);
            border: 1px dashed var(--border);
            padding: 1.25rem 1.5rem;
            width: 100%;
            max-width: 680px;
            min-height: 70px;
        }

        .decode-text {
            font-size: clamp(0.8rem,2.2vw,1rem);
            letter-spacing: 0.12em;
            line-height: 2;
            word-break: break-all;
            color: #0d3322;
            transition: color 0.4s;
        }
        .decode-text.lit {
            color: var(--fg);
            text-shadow: 0 0 6px rgba(0,255,136,0.2);
        }

        .btn-verify {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg);
            font-family: inherit;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            padding: 10px 32px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-verify:hover { border-color: var(--fg); box-shadow: 0 0 20px rgba(0,255,136,0.1); }
        .btn-verify:active { transform: scale(0.97); }
        .btn-verify:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }

        .err-msg {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.3s;
            height: 1em;
        }
        .err-msg.show { opacity: 1; }

        .attempts {
            font-size: 0.55rem;
            letter-spacing: 0.2em;
            color: #0a2a1a;
        }

        .hint {
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            color: #0a1f15;
            margin-top: 0.25rem;
        }

        /* ---- FLASH ---- */
        .flash-layer {
            position: fixed;
            inset: 0;
            z-index: 60;
            pointer-events: none;
            opacity: 0;
        }
        .flash-layer.go-green { background: var(--fg); animation: flashAnim 0.25s ease-out forwards; }
        .flash-layer.go-red   { background: var(--accent); animation: flashAnim 0.25s ease-out forwards; }
        @keyframes flashAnim {
            0%   { opacity: 0.35; }
            100% { opacity: 0; }
        }

        /* ---- WIN ---- */
        #win {
            position: fixed;
            inset: 0;
            z-index: 55;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.5rem;
            background: var(--bg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }
        #win.show { opacity: 1; pointer-events: all; }

        .win-msg-box {
            padding: 2rem;
            border: 1px solid var(--border);
            max-width: 600px;
            text-align: center;
            font-size: clamp(0.9rem,2.5vw,1.2rem);
            letter-spacing: 0.15em;
            line-height: 2.2;
            word-break: break-all;
            color: var(--fg);
            text-shadow: 0 0 10px rgba(0,255,136,0.2);
        }
        .win-msg-box::before {
            content: 'DECODED:';
            display: block;
            font-size: 0.55rem;
            letter-spacing: 0.4em;
            color: var(--dim);
            margin-bottom: 1rem;
        }

        .glitch-text { animation: glitch 0.2s ease; }
        @keyframes glitch {
            0%   { transform: translate(0); filter: none; }
            25%  { transform: translate(-3px,1px); filter: hue-rotate(90deg); }
            50%  { transform: translate(2px,-2px); }
            75%  { transform: translate(-1px,-1px); filter: hue-rotate(-90deg); }
            100% { transform: translate(0); filter: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 480px) {
            .cipher-box, .decode-box { padding: 1rem 1rem 1rem 2rem; }
            .shift-num { font-size: 1.8rem; }
            .btn-initiate { padding: 12px 32px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <!-- Background layers -->
    <canvas id="rain" aria-hidden="true"></canvas>
    <div class="overlay scanlines" aria-hidden="true"></div>
    <div class="overlay vignette" aria-hidden="true"></div>
    <div class="flash-layer" id="flash" aria-hidden="true"></div>

    <!-- INTRO SCREEN -->
    <div id="intro" role="dialog" aria-label="Intro">
        <div style="text-align:center; max-width:560px; padding:2rem;">
            <div class="intro-line" id="t1" style="font-size:clamp(1.1rem,4vw,1.6rem); font-weight:800; letter-spacing:0.2em;"></div>
            <div style="height:1.8rem;"></div>
            <div class="stamp" id="stamp">CLASSIFIED // EYES ONLY</div>
            <div style="height:2rem;"></div>
            <div class="intro-line" id="t2" style="font-size:0.78rem; color:var(--muted); letter-spacing:0.08em;"></div>
            <div style="height:0.6rem;"></div>
            <div class="intro-line" id="t3" style="font-size:0.72rem; color:var(--dim); letter-spacing:0.06em;"></div>
            <div style="height:2.5rem;"></div>
            <button class="btn-initiate" id="btnStart" aria-label="Start the decode sequence">INITIATE</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <main id="game" role="main" aria-label="Decode game">
        <div class="label">Encrypted Transmission</div>
        <div class="cipher-box">
            <div class="cipher-text" id="cipherText" aria-label="Encrypted text"></div>
        </div>
        <div class="shift-row">
            <span class="label">Shift</span>
            <button class="btn-shift" id="btnMinus" aria-label="Decrease shift">&minus;</button>
            <span class="shift-num" id="shiftNum">00</span>
            <button class="btn-shift" id="btnPlus" aria-label="Increase shift">+</button>
            <span class="attempts" id="attempts"></span>
        </div>
        <div class="decode-box">
            <div class="label" style="margin-bottom:0.6rem;">Decoded Output</div>
            <div class="decode-text" id="decodeText" aria-live="polite"></div>
        </div>
        <button class="btn-verify" id="btnVerify">Verify Decode</button>
        <div class="err-msg" id="errMsg">Decode failed // try again</div>
        <div class="hint">Arrow keys or buttons to adjust shift &middot; Enter to verify</div>
    </main>

    <!-- WIN SCREEN -->
    <div id="win" role="dialog" aria-label="Decoded successfully">
        <div style="font-size:clamp(1.3rem,4vw,2rem); font-weight:800; letter-spacing:0.35em;">ACCESS GRANTED</div>
        <div style="font-size:0.65rem; letter-spacing:0.25em; color:var(--muted);">TRANSMISSION DECODED SUCCESSFULLY</div>
        <div class="win-msg-box" id="winMsg"></div>
        <div style="font-size:0.6rem; letter-spacing:0.2em; color:var(--dim);">Transmission complete // connection terminated</div>
    </div>

    <script>
        /* =============================================
           MATRIX RAIN — subtle falling characters
           ============================================= */
        const canvas = document.getElementById('rain');
        const ctx = canvas.getContext('2d');
        let cols, drops;

        function initRain() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cols = Math.floor(canvas.width / 14);
            drops = Array.from({ length: cols }, () => Math.random() * -80);
        }
        initRain();
        window.addEventListener('resize', initRain);

        const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>{}[]';

        function drawRain() {
            ctx.fillStyle = 'rgba(5,5,5,0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = '14px JetBrains Mono, monospace';

            for (let i = 0; i < cols; i++) {
                if (drops[i] > 0) {
                    const alpha = 0.03 + Math.random() * 0.06;
                    ctx.fillStyle = `rgba(0,255,136,${alpha})`;
                    ctx.fillText(glyphs[Math.floor(Math.random() * glyphs.length)], i * 14, drops[i] * 14);
                }
                if (drops[i] * 14 > canvas.height && Math.random() > 0.985) drops[i] = 0;
                drops[i] += 0.4 + Math.random() * 0.2;
            }
            requestAnimationFrame(drawRain);
        }
        drawRain();

        /* =============================================
           TYPING EFFECT — intro sequence
           ============================================= */
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function typeInto(el, text, speed = 55) {
            for (let i = 0; i < text.length; i++) {
                el.textContent += text[i];
                await sleep(speed + Math.random() * 20);
            }
        }

        async function playIntro() {
            const t1 = document.getElementById('t1');
            const stamp = document.getElementById('stamp');
            const t2 = document.getElementById('t2');
            const t3 = document.getElementById('t3');
            const btn = document.getElementById('btnStart');

            await sleep(600);
            await typeInto(t1, 'SIGNAL INTERCEPTED', 90);

            await sleep(700);
            stamp.classList.add('show');

            await sleep(900);
            await typeInto(t2, "You found something that wasn't meant for you.", 38);

            await sleep(500);
            await typeInto(t3, 'Decode it. Or walk away.', 55);

            await sleep(700);
            btn.classList.add('show');
            btn.focus();
        }
        playIntro();

        /* =============================================
           CIPHER ENGINE — Caesar cipher
           ============================================= */
        const SECRET = 'THE TRUTH IS HIDDEN IN PLAIN SIGHT';
        const ANSWER_SHIFT = 7;
        let shift = 0;
        let attempts = 0;

        function caesar(text, s) {
            return text.split('').map(c => {
                if (/[a-z]/.test(c)) return String.fromCharCode(((c.charCodeAt(0) - 97 + s) % 26 + 26) % 26 + 97);
                if (/[A-Z]/.test(c)) return String.fromCharCode(((c.charCodeAt(0) - 65 + s) % 26 + 26) % 26 + 65);
                return c;
            }).join('');
        }

        const encrypted = caesar(SECRET, ANSWER_SHIFT);

        /* =============================================
           GAME STATE
           ============================================= */
        function randomStartShift() {
            let s = Math.floor(Math.random() * 25) + 1;
            if (s === ANSWER_SHIFT) s = (s % 25) + 1;
            return s;
        }

        function updateDisplay() {
            document.getElementById('shiftNum').textContent = String(shift).padStart(2, '0');
            const decoded = caesar(encrypted, 26 - shift);
            const el = document.getElementById('decodeText');
            el.textContent = decoded;
            el.classList.toggle('lit', shift === ANSWER_SHIFT);
            document.getElementById('errMsg').classList.remove('show');
        }

        function changeShift(d) {
            shift = ((shift + d) % 26 + 26) % 26;
            updateDisplay();
            const el = document.getElementById('decodeText');
            el.classList.remove('glitch-text');
            void el.offsetWidth;
            el.classList.add('glitch-text');
        }

        function flash(type) {
            const f = document.getElementById('flash');
            f.className = 'flash-layer';
            void f.offsetWidth;
            f.classList.add(type === 'green' ? 'go-green' : 'go-red');
        }

        function verify() {
            attempts++;
            document.getElementById('attempts').textContent = 'ATTEMPTS: ' + attempts;

            if (shift === ANSWER_SHIFT) {
                flash('green');
                setTimeout(() => {
                    document.getElementById('game').classList.remove('show');
                    setTimeout(() => {
                        document.getElementById('winMsg').textContent = SECRET;
                        document.getElementById('win').classList.add('show');
                    }, 600);
                }, 350);
            } else {
                flash('red');
                document.getElementById('errMsg').classList.add('show');
                const box = document.querySelector('.cipher-box');
                box.style.animation = 'none';
                void box.offsetWidth;
                box.style.animation = 'glitch 0.25s ease';
            }
        }

        /* =============================================
           START GAME — transition from intro
           ============================================= */
        function startGame() {
            const btn = document.getElementById('btnStart');
            btn.textContent = 'INITIATING...';
            btn.style.pointerEvents = 'none';
            flash('green');

            setTimeout(() => {
                document.getElementById('intro').classList.add('fade-out');
                shift = randomStartShift();
                document.getElementById('cipherText').textContent = encrypted;
                updateDisplay();

                setTimeout(() => {
                    document.getElementById('intro').style.display = 'none';
                    const game = document.getElementById('game');
                    game.style.display = 'flex';
                    void game.offsetHeight;
                    game.classList.add('show');
                }, 800);
            }, 400);
        }

        /* =============================================
           EVENT LISTENERS
           ============================================= */
        document.getElementById('btnStart').addEventListener('click', startGame);
        document.getElementById('btnMinus').addEventListener('click', () => changeShift(-1));
        document.getElementById('btnPlus').addEventListener('click', () => changeShift(1));
        document.getElementById('btnVerify').addEventListener('click', verify);

        document.addEventListener('keydown', e => {
            const game = document.getElementById('game');
            // On intro screen — Enter starts game
            if (!game.classList.contains('show')) {
                if (e.key === 'Enter' && document.getElementById('btnStart').classList.contains('show')) {
                    startGame();
                }
                return;
            }
            if (e.key === 'ArrowLeft')  { e.preventDefault(); changeShift(-1); }
            if (e.key === 'ArrowRight') { e.preventDefault(); changeShift(1); }
            if (e.key === 'Enter')      { e.preventDefault(); verify(); }
        });
    </script>
</body>
</html>
