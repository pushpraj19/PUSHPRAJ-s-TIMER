<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Vault · Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #14171f;
    --panel: #1b2029;
    --panel-edge: #262c38;
    --brass: #c9a24b;
    --brass-light: #e6c877;
    --brass-dim: #7a6633;
    --text: #ece7da;
    --muted: #8b8f9b;
    --error: #c0463a;
    --success: #4c8c62;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #232938 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow-x:hidden;
  }

  #intro{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background: var(--bg);
    transition: opacity 1s ease, visibility 1s ease;
  }
  #intro.gone{ opacity:0; visibility:hidden; pointer-events:none; }

  .intro-inner{
    text-align:center;
    max-width:360px;
    padding:0 24px;
  }

  .intro-emblem{
    width:52px; height:52px;
    margin:0 auto 24px;
    opacity:0;
    transform:scale(.8);
    transition: opacity .8s ease, transform .8s cubic-bezier(.34,1.56,.64,1);
  }
  .intro-emblem.show{ opacity:1; transform:scale(1); }
  .intro-emblem svg{ width:100%; height:100%; }

  .intro-greet{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:.06em;
    color:var(--muted);
    margin:0 0 10px;
    opacity:0;
    transform:translateY(8px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .intro-greet.show{ opacity:1; transform:translateY(0); }

  .intro-title{
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(20px,5.5vw,26px);
    font-weight:800;
    letter-spacing:.2em;
    color:var(--brass-light);
    margin:0 0 24px;
    opacity:0;
    transform:translateY(10px);
    transition: opacity .7s ease .15s, transform .7s ease .15s;
  }
  .intro-title.show{ opacity:1; transform:translateY(0); }

  .intro-line{
    width:40px; height:1px;
    background:var(--brass-dim);
    margin:0 auto 24px;
    opacity:0;
    transition: opacity .6s ease;
  }
  .intro-line.show{ opacity:1; }

  .intro-desc{
    font-size:13.5px;
    line-height:1.75;
    color:var(--muted);
    margin:0 0 10px;
    opacity:0;
    transform:translateY(6px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .intro-desc.show{ opacity:1; transform:translateY(0); }
  .intro-desc.last{ margin-bottom:28px; }
  .intro-desc strong{ color:var(--text); font-weight:600; }

  .intro-stamp{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:.4em;
    color:var(--error);
    border:1px solid var(--error);
    padding:5px 18px;
    margin-bottom:32px;
    opacity:0;
    transform:rotate(-2deg) scale(.88);
    transition: opacity .5s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .intro-stamp.show{ opacity:.8; transform:rotate(0) scale(1); }

  .intro-btn{
    background:transparent;
    border:1px solid var(--brass-dim);
    color:var(--brass);
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:.3em;
    padding:14px 52px;
    cursor:pointer;
    opacity:0;
    transform:translateY(8px);
    transition: opacity .6s ease, transform .6s ease, background .25s, color .25s, border-color .25s, box-shadow .25s;
  }
  .intro-btn.show{ opacity:1; transform:translateY(0); }
  .intro-btn:hover{
    background:var(--brass);
    color:var(--bg);
    border-color:var(--brass);
    box-shadow:0 0 30px rgba(201,162,75,.2);
  }
  .intro-btn:active{ transform:scale(.97); }
  .intro-btn:focus-visible{ outline:2px solid var(--brass-light); outline-offset:4px; }

  body::after{
    content:'';
    position:fixed;
    top:30%; left:50%;
    width:500px; height:500px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(201,162,75,.03) 0%, transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  .stage{
    width:100%; max-width:420px;
    padding:28px 20px 40px;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    position:relative;
    z-index:1;
  }

  .dots{ display:flex; gap:9px; }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--panel-edge);
    border:1px solid var(--brass-dim);
    transition: all .3s ease;
  }
  .dot.done{ background:var(--brass); border-color:var(--brass); box-shadow:0 0 8px rgba(201,162,75,.6); }
  .dot.active{ background:var(--brass-light); border-color:var(--brass-light); box-shadow:0 0 10px rgba(230,200,119,.8); transform:scale(1.3); }

  .lock-wrap{ position:relative; width:64px; height:64px; }
  .lock-wrap svg{ width:100%; height:100%; }
  .shackle{ transform-origin: 32px 24px; transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
  .lock-wrap.open .shackle{ transform: translateY(-6px) rotate(-25deg); }
  .lock-body{ fill:var(--panel); stroke:var(--brass); stroke-width:2; }
  .shackle{ fill:none; stroke:var(--brass); stroke-width:3; }
  .keyhole{ fill:var(--brass-dim); }

  h1.eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--brass); margin:0; font-weight:700;
  }

  .plaque{
    width:100%;
    background:linear-gradient(180deg, var(--panel) 0%, #171b23 100%);
    border:1px solid var(--panel-edge);
    border-radius:10px;
    padding:22px 20px;
    position:relative;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 12px 28px rgba(0,0,0,.35);
  }
  .plaque::before{
    content:'';
    position:absolute; inset:6px;
    border:1px solid var(--panel-edge);
    border-radius:6px;
    pointer-events:none;
  }
  .level-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; color:var(--muted); letter-spacing:.12em;
    margin-bottom:10px; display:block;
  }
  .hint-text{
    font-family:'Inter', sans-serif;
    font-size:17px; line-height:1.55; color:var(--text);
    margin:0;
  }

  form{ width:100%; display:flex; flex-direction:column; gap:12px; }
  input[type=text]{
    width:100%;
    background:#10131a;
    border:1px solid var(--panel-edge);
    border-radius:8px;
    padding:16px 14px;
    font-family:'JetBrains Mono', monospace;
    font-size:18px; letter-spacing:.08em;
    color:var(--brass-light);
    text-transform:uppercase;
    text-align:center;
    outline:none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type=text]::placeholder{ color:#4a4f5c; letter-spacing:.05em; text-transform:none; font-size:14px;}
  input[type=text]:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(201,162,75,.15); }
  input.shake{ animation: shake .4s; border-color:var(--error); }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(5px);}
  }

  button{
    width:100%;
    background:linear-gradient(180deg, var(--brass-light), var(--brass));
    color:#14171f;
    border:none; border-radius:8px;
    padding:15px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    cursor:pointer;
    transition: transform .15s, filter .15s;
  }
  button:active{ transform:scale(.97); }
  button:disabled{ opacity:.5; cursor:default; }

  .msg{
    min-height:18px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:.05em;
    text-align:center;
  }
  .msg.error{ color:var(--error); }
  .msg.success{ color:var(--success); }

  .mode-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:10px; color:var(--muted); letter-spacing:.1em;
    opacity:.7;
  }

  .done-screen{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .done-screen h2{ font-family:'JetBrains Mono', monospace; color:var(--brass-light); letter-spacing:.05em; margin:0; }
  .done-screen p{ color:var(--muted); margin:0; font-size:14px; }
</style>
</head>
<body>

<!-- ===== INTRO SCREEN ===== -->
<div id="intro" role="dialog" aria-label="Welcome">
  <div class="intro-inner">
    <div class="intro-emblem" id="introEmblem">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M20 26 V18 a12 12 0 0 1 24 0 V26" stroke="#c9a24b" stroke-width="3" fill="none"/>
        <rect x="14" y="26" width="36" height="28" rx="6" fill="#1b2029" stroke="#c9a24b" stroke-width="2"/>
        <circle cx="32" cy="38" r="3.5" fill="#7a6633"/>
        <rect x="30.5" y="40" width="3" height="7" fill="#7a6633"/>
      </svg>
    </div>
    <p class="intro-greet" id="introGreet">Welcome, stranger.</p>
    <p class="intro-title" id="introTitle">THE VAULT</p>
    <div class="intro-line" id="introLine"></div>
    <p class="intro-desc" id="introD1">This is a sealed puzzle. Each level hides a secret behind a clue — <strong>decode it and you advance</strong>.</p>
    <p class="intro-desc last" id="introD2">Solve them all and the vault opens. Most won't. Let's see if you do.</p>
    <div class="intro-stamp" id="introStamp">CLASSIFIED</div>
    <button class="intro-btn" id="introBtn" aria-label="Enter the vault">ENTER THE VAULT</button>
  </div>
</div>

<!-- ===== EXISTING GAME (completely untouched) ===== -->
<div class="stage" id="stage">
  <span class="eyebrow">The Vault</span>
  <div class="lock-wrap" id="lockIcon">
    <svg viewBox="0 0 64 64">
      <path class="shackle" d="M20 26 V18 a12 12 0 0 1 24 0 V26" />
      <rect class="lock-body" x="14" y="26" width="36" height="28" rx="6"/>
      <circle class="keyhole" cx="32" cy="38" r="3.5"/>
      <rect class="keyhole" x="30.5" y="40" width="3" height="7"/>
    </svg>
  </div>
  <div class="dots" id="dots"></div>

  <div id="gameArea" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:18px;">
    <div class="plaque">
      <span class="level-tag" id="levelTag">LEVEL —</span>
      <p class="hint-text" id="hintText">Loading...</p>
    </div>
    <form id="answerForm">
      <input type="text" id="answerInput" placeholder="Enter the code" autocomplete="off" autocapitalize="characters">
      <button type="submit" id="submitBtn">Unlock</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <span class="mode-tag" id="modeTag">checking session…</span>
</div>

<script>
// ===== INTRO — checks session and greets by email =====
(function(){
  const SUPABASE_URL = 'https://omxfdzmagxoidbgcajqq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_t2pqsg2pXxC0YlPcsayc1A_EpvjMGjx';

  const greetEl = document.getElementById('introGreet');
  const emblem = document.getElementById('introEmblem');
  const title  = document.getElementById('introTitle');
  const line   = document.getElementById('introLine');
  const d1     = document.getElementById('introD1');
  const d2     = document.getElementById('introD2');
  const stamp  = document.getElementById('introStamp');
  const btn    = document.getElementById('introBtn');
  const intro  = document.getElementById('intro');

  // Kick off session check immediately — it'll resolve well before greeting appears
  window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    .auth.getSession()
    .then(({ data: { session } }) => {
      if (session && session.user && session.user.email) {
        // Show just the name part before @, e.g. "alex" from "alex@gmail.com"
        const name = session.user.email.split('@')[0];
        greetEl.textContent = 'Welcome, ' + name + '.';
      }
    });

  setTimeout(() => emblem.classList.add('show'), 300);
  setTimeout(() => greet.classList.add('show'), 700);
  setTimeout(() => title.classList.add('show'), 1000);
  setTimeout(() => line.classList.add('show'), 1350);
  setTimeout(() => d1.classList.add('show'), 1550);
  setTimeout(() => d2.classList.add('show'), 1800);
  setTimeout(() => stamp.classList.add('show'), 2100);
  setTimeout(() => { btn.classList.add('show'); btn.focus(); }, 2400);

  function dismissIntro(){
    btn.style.pointerEvents = 'none';
    intro.classList.add('gone');
    setTimeout(() => {
      const inp = document.getElementById('answerInput');
      if(inp) inp.focus();
    }, 1000);
  }

  btn.addEventListener('click', dismissIntro);
  document.addEventListener('keydown', function handler(e){
    if(e.key === 'Enter' && btn.classList.contains('show') && !intro.classList.contains('gone')){
      dismissIntro();
      document.removeEventListener('keydown', handler);
    }
  });
})();
</script>

<script>
// ====== CONFIG — fill these in with your Supabase project details ======
const SUPABASE_URL = 'https://omxfdzmagxoidbgcajqq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_t2pqsg2pXxC0YlPcsayc1A_EpvjMGjx';
// =========================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const LOCAL_KEY = 'vault_puzzle_level';

let state = {
  userId: null,
  isOffline: true,
  currentLevel: 1,
  totalLevels: 0,
  levelRow: null,
};

const el = {
  dots: document.getElementById('dots'),
  levelTag: document.getElementById('levelTag'),
  hintText: document.getElementById('hintText'),
  form: document.getElementById('answerForm'),
  input: document.getElementById('answerInput'),
  submitBtn: document.getElementById('submitBtn'),
  msg: document.getElementById('msg'),
  modeTag: document.getElementById('modeTag'),
  lockIcon: document.getElementById('lockIcon'),
  gameArea: document.getElementById('gameArea'),
  stage: document.getElementById('stage'),
};

async function init() {
  const { count } = await sb
    .from('puzzle_levels_public')
    .select('*', { count: 'exact', head: true });
  state.totalLevels = count || 0;

  const { data: { session } } = await sb.auth.getSession();

  if (session && session.user) {
    state.userId = session.user.id;
    state.isOffline = false;
    el.modeTag.textContent = 'signed in · progress synced';

    let { data: progress } = await sb
      .from('puzzle_progress')
      .select('current_level')
      .eq('user_id', state.userId)
      .maybeSingle();

    if (!progress) {
      await sb.from('puzzle_progress').insert({ user_id: state.userId, current_level: 1 });
      state.currentLevel = 1;
    } else {
      state.currentLevel = progress.current_level;
    }
  } else {
    state.isOffline = true;
    el.modeTag.textContent = 'playing offline · progress saved on this device';
    state.currentLevel = parseInt(localStorage.getItem(LOCAL_KEY) || '1', 10);
  }

  renderDots();
  await loadLevel();
}

function renderDots() {
  el.dots.innerHTML = '';
  for (let i = 1; i <= state.totalLevels; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < state.currentLevel ? ' done' : i === state.currentLevel ? ' active' : '');
    el.dots.appendChild(d);
  }
}

async function loadLevel() {
  if (state.currentLevel > state.totalLevels) {
    showDoneScreen();
    return;
  }
  const { data, error } = await sb
    .from('puzzle_levels_public')
    .select('id, level_number, hint')
    .eq('level_number', state.currentLevel)
    .single();

  if (error || !data) {
    el.hintText.textContent = 'Could not load this level. Check your Supabase config / table contents.';
    return;
  }
  state.levelRow = data;
  el.levelTag.textContent = `LEVEL ${state.currentLevel} / ${state.totalLevels}`;
  el.hintText.textContent = data.hint;
  el.input.value = '';
  el.msg.textContent = '';
  el.msg.className = 'msg';
}

function showDoneScreen() {
  el.lockIcon.classList.add('open');
  el.gameArea.innerHTML = `
    <div class="done-screen">
      <h2>VAULT CLEARED</h2>
      <p>You solved all ${state.totalLevels} levels. Nicely done.</p>
    </div>`;
}

el.form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const guess = el.input.value.trim().toUpperCase();
  if (!guess) return;
  el.submitBtn.disabled = true;

  const { data: correct, error } = await sb
    .rpc('check_puzzle_answer', {
      level_num: state.currentLevel,
      guess: guess
    });

  if (error) {
    el.msg.textContent = 'CONNECTION ERROR — TRY AGAIN';
    el.msg.className = 'msg error';
    el.submitBtn.disabled = false;
    return;
  }

  if (correct) {
    el.msg.textContent = 'CORRECT';
    el.msg.className = 'msg success';
    el.lockIcon.classList.add('open');

    state.currentLevel += 1;

    if (state.isOffline) {
      localStorage.setItem(LOCAL_KEY, state.currentLevel);
    } else {
      await sb
        .from('puzzle_progress')
        .update({ current_level: state.currentLevel, updated_at: new Date().toISOString() })
        .eq('user_id', state.userId);
    }

    setTimeout(async () => {
      el.lockIcon.classList.remove('open');
      renderDots();
      await loadLevel();
      el.submitBtn.disabled = false;
    }, 750);
  } else {
    el.msg.textContent = 'INCORRECT — TRY AGAIN';
    el.msg.className = 'msg error';
    el.input.classList.add('shake');
    setTimeout(() => el.input.classList.remove('shake'), 400);
    el.submitBtn.disabled = false;
  }
});

init();
</script>
</body>
</html>
